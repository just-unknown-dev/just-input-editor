name: just_input_editor
description: "The Input Actions editor for just_inputs: maps, actions and bindings; keyboard, gamepad and touch views; a live test; and the module that puts it in just_game_engine_editor."
version: 0.1.0-beta.1
homepage: https://engine.justunknown.com/
repository: https://github.com/just-unknown-dev/just-input-editor
issue_tracker: https://github.com/just-unknown-dev/just-input-editor/issues
# A plugin: shared through the Asset Store from GitHub, never pub.dev.
publish_to: none

environment:
  # just_inputs needs Dart 3.12 (private named initializing formals).
  sdk: ^3.12.2
  # just_editor_core's floor, from just_game_engine: 3.47.1 is the first
  # stable where Flutter GPU can be switched on in Windows and Linux builds.
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter

  # The input core this edits: assets, actions, devices, players. The game
  # depends on it through just_game_engine; this package only shows it.
  just_inputs: ^0.1.0

  # The gamepad view names a pad's type (Xbox, PlayStation, ...), which
  # just_inputs does not re-export.
  just_gamepads: ^0.1.0

  # The editor's module contract this plugs in through (and, through it,
  # the engine). Design-time only: the whole package is, so a game never
  # imports any of it.
  just_editor_core: ^0.1.0-dev.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The module's test runs a real engine, to see a save change its input.
  just_game_engine: ^2.0.0-dev.2

flutter:
  uses-material-design: true
