name: just_input_editor
description: "The Input Actions editor for just_inputs: maps, actions and bindings; keyboard, gamepad and touch views; a live test; and the module that puts it in just_game_engine_editor."
version: 0.1.0
homepage: https://engine.justunknown.com/
repository: https://github.com/just-unknown-dev/just-gamepads
issue_tracker: https://github.com/just-unknown-dev/just-gamepads/issues

environment:
  # just_inputs needs 3.12 (private named initializing formals).
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # The input core this edits: assets, actions, devices, players. The game
  # depends on it through just_game_engine; this package only shows it.
  just_inputs: ^0.0.1

  # The gamepad view names a pad's type (Xbox, PlayStation, ...), which
  # just_inputs does not re-export.
  just_gamepads: ^0.1.0

  # The editor this plugs into, as a module. Design-time only: the whole
  # package is, so a game never imports any of it.
  just_game_engine: ^2.0.0
  just_game_engine_editor: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
